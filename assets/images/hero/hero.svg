<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960" role="img" aria-label="Illustration d'un ordinateur portable, d'un smartphone et d'un boîtier d'écouteurs">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F8FA"/>
      <stop offset="1" stop-color="#E3ECFA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1769E0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1769E0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1769E0"/>
      <stop offset="1" stop-color="#6FA6FF"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9DDE5"/>
      <stop offset="1" stop-color="#B9BFCB"/>
    </linearGradient>
    <linearGradient id="phoneScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF1FD"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="960" height="960" fill="url(#bg)"/>
  <circle cx="480" cy="470" r="400" fill="url(#glow)"/>

  <!-- Trame de points décorative -->
  <g fill="#1769E0" opacity="0.18">
    <circle cx="780" cy="170" r="3"/><circle cx="816" cy="170" r="3"/><circle cx="852" cy="170" r="3"/>
    <circle cx="780" cy="206" r="3"/><circle cx="816" cy="206" r="3"/><circle cx="852" cy="206" r="3"/>
    <circle cx="780" cy="242" r="3"/><circle cx="816" cy="242" r="3"/><circle cx="852" cy="242" r="3"/>
  </g>

  <!-- Ombres au sol -->
  <ellipse cx="440" cy="640" rx="300" ry="22" fill="#17181A" opacity="0.14" filter="url(#soft)"/>
  <ellipse cx="710" cy="760" rx="110" ry="14" fill="#17181A" opacity="0.16" filter="url(#soft)"/>

  <!-- Ordinateur portable -->
  <g>
    <rect x="190" y="230" width="500" height="330" rx="22" fill="#17181A"/>
    <rect x="206" y="246" width="468" height="298" rx="10" fill="url(#screen)"/>
    <g fill="#FFFFFF">
      <rect x="236" y="276" width="150" height="14" rx="7" opacity="0.9"/>
      <rect x="236" y="304" width="96" height="10" rx="5" opacity="0.55"/>
      <rect x="236" y="354" width="190" height="120" rx="14" opacity="0.22"/>
      <rect x="446" y="354" width="190" height="56" rx="14" opacity="0.32"/>
      <rect x="446" y="418" width="190" height="56" rx="14" opacity="0.18"/>
    </g>
    <path d="M140 566 H740 a0 0 0 0 1 0 0 l-18 38 a22 22 0 0 1 -20 12 H178 a22 22 0 0 1 -20 -12 z" fill="url(#base)"/>
    <rect x="390" y="566" width="100" height="10" rx="5" fill="#9AA1AF" opacity="0.8"/>
  </g>

  <!-- Smartphone -->
  <g>
    <rect x="620" y="400" width="180" height="360" rx="38" fill="#17181A"/>
    <rect x="632" y="412" width="156" height="336" rx="28" fill="url(#phoneScreen)"/>
    <rect x="676" y="424" width="68" height="16" rx="8" fill="#17181A"/>
    <g>
      <rect x="652" y="470" width="116" height="12" rx="6" fill="#17181A" opacity="0.85"/>
      <rect x="652" y="494" width="70" height="9" rx="4.5" fill="#666A73" opacity="0.6"/>
      <rect x="652" y="536" width="116" height="84" rx="16" fill="url(#screen)"/>
      <rect x="652" y="634" width="54" height="54" rx="14" fill="#1769E0" opacity="0.18"/>
      <rect x="714" y="634" width="54" height="54" rx="14" fill="#1769E0" opacity="0.1"/>
    </g>
  </g>

  <!-- Boîtier d'écouteurs -->
  <g>
    <rect x="130" y="600" width="150" height="110" rx="46" fill="#FFFFFF" stroke="#D5DAE3" stroke-width="2"/>
    <path d="M130 654 H280" stroke="#D5DAE3" stroke-width="2"/>
    <circle cx="205" cy="676" r="6" fill="#1769E0"/>
  </g>
</svg>
